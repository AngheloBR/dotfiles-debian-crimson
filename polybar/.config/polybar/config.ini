; ═══════════════════════════════════════════════
;  polybar — Rice "Debian Crimson" v3
;  Iconos Material Design (Nerd Font v3, U+F0xxx)
;  Aqui van literales: polybar no interpreta \u.
;  Si un icono se pierde al copiar, buscar el
;  codepoint del comentario en nerdfonts.com/cheat-sheet
; ═══════════════════════════════════════════════

[colors]
fondo    = #ee0f0f12
texto    = #b3b3b8
carmesi  = #D70A53
dorado   = #E8B04B
apagado  = #45474e

[bar/main]
; el monitor lo pasa ajustar-monitores.sh en la variable MONITOR (eDP en
; la laptop, Virtual-1 en una VM); si falta, polybar usa el primario
monitor = ${env:MONITOR:}
width = 100%
height = 28
background = ${colors.fondo}
foreground = ${colors.texto}
padding-left = 1
padding-right = 1
module-margin = 1
; variante NO Mono: los iconos salen a doble ancho (mas grandes y legibles)
font-0 = JetBrainsMono Nerd Font:size=11;2
; los modulos "condicionales" (musica, actualizaciones, vpn, bluetooth) no
; imprimen nada cuando no aplican y desaparecen de la barra solos
modules-left = logo bspwm voz musica
modules-center = date
modules-right = tray dnd actualizaciones firewall vpn network bluetooth temperatura cpu memory battery volume mic luz power
; permite "polybar-msg cmd restart" (lo usa el menu F9)
enable-ipc = true
; el modulo internal/date no hereda LANG: sin esto la fecha sale en ingles
locale = es_PE.UTF-8

; ─── izquierda ───

[module/logo]
type = custom/text
; nf-linux-debian U+F306
label = ""
label-foreground = ${colors.dorado}
label-padding = 1

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
; click en un escritorio = saltar a el
label-focused = %{A1:bspc desktop -f ^%index%:}%name%%{A}
label-focused-background = ${colors.carmesi}
label-focused-foreground = #0f0f12
label-focused-padding = 2
label-occupied = %{A1:bspc desktop -f ^%index%:}%name%%{A}
label-occupied-foreground = ${colors.carmesi}
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.apagado}
label-empty-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.dorado}
label-urgent-foreground = #0f0f12
label-urgent-padding = 2
scroll-up = bspc desktop -f prev.local
scroll-down = bspc desktop -f next.local

[module/voz]
; tres botones (retroceder 10 s / pausa-reanudar / cortar) que solo
; aparecen mientras lee. Los clicks van dentro del texto que imprime el
; script, como en el modulo de musica: cada icono hace una cosa y ya.
type = custom/script
exec = ~/.local/bin/leer.sh estado
interval = 2

[module/musica]
; modo tail: playerctl -F avisa por eventos, sin polling.
; Los botones (anterior / pausa / siguiente) van dentro del texto que
; imprime el script; el titulo no reacciona a clicks.
type = custom/script
exec = ~/.local/bin/estado-musica.sh
tail = true

; ─── centro ───

[module/date]
; modulo interno: sin script ni proceso cada 5 s
type = internal/date
interval = 5
date = %a %d
time = %H:%M
; nf-md-clock_outline U+F0954
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.dorado}
label = %date% · %time%

; ─── derecha ───

[module/tray]
; Bandeja del sistema: aqui aparecen las apps que se esconden al cerrarlas
; (Discord, AnyDesk, RustDesk, OBS, Telegram...). Click derecho en su icono
; = menu de la app, con su "Salir". Sin esto se quedarian corriendo
; invisibles y habria que matarlas desde la terminal.
; Solo puede haber UNA bandeja en X11: si algun dia falla, mirar que no
; corra otra (stalonetray, trayer...).
type = internal/tray
tray-size = 16
tray-spacing = 6px
tray-padding = 4px
tray-background = ${colors.fondo}

[module/dnd]
; campana tachada carmesi solo cuando las notificaciones estan en pausa
type = custom/script
exec = ~/.local/bin/no-molestar.sh
interval = 10
click-left = ~/.local/bin/no-molestar.sh toggle

[module/actualizaciones]
type = custom/script
exec = ~/.local/bin/actualizaciones.sh
; cada 30 min (apt-get -s tarda ~0.3 s; no hace falta mas)
interval = 1800
click-left = ~/.local/bin/actualizaciones.sh instalar

[module/firewall]
; escudo dorado = perfil privada (casa), carmesi = publica (calle)
type = custom/script
exec = ~/.local/bin/firewall.sh
interval = 10
click-left = ~/.local/bin/firewall.sh menu

[module/vpn]
type = custom/script
exec = ~/.local/bin/vpn.sh
interval = 5
click-left = ~/.local/bin/vpn.sh menu

[module/network]
type = custom/script
exec = ~/.local/bin/red-wifi.sh
interval = 5
; click en el icono -> menu de redes (conectar, clave, olvidar, apagar)
click-left = ~/.local/bin/wifi-menu.sh

[module/bluetooth]
type = custom/script
exec = ~/.local/bin/estado-bluetooth.sh
interval = 5
; click en el icono -> menu de dispositivos (conectar/desconectar)
click-left = ~/.local/bin/bluetooth-menu.sh

[module/temperatura]
type = custom/script
exec = ~/.local/bin/estado-temperatura.sh
interval = 5

[module/cpu]
type = internal/cpu
interval = 3
; nf-md-cpu_64_bit U+F0EE0
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.carmesi}
label = %percentage%%

[module/memory]
type = internal/memory
interval = 5
; nf-md-memory U+F035B
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.dorado}
label = %percentage_used%%

[module/battery]
type = internal/battery
; los nombres los pasa ajustar-monitores.sh (BAT0/ADP0 aqui, otros en
; otro equipo); si faltan, se usan los de esta laptop
battery = ${env:BATERIA:BAT0}
adapter = ${env:ADAPTADOR:ADP0}
full-at = 98
low-at = 20
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-low = <label-low>
format-full = <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
; nf-md-battery_alert U+F0083
label-low = "%{F#D70A53}󰂃%{F-} %percentage%% BAJA"
; nf-md-battery U+F0079
label-full = "%{F#E8B04B}󰁹%{F-} full"
; nf-md-battery_10..90 (U+F007A, F007C, F007E, F0080, F0082)
ramp-capacity-0 = "%{F#D70A53}󰁺%{F-}"
ramp-capacity-1 = "%{F#D70A53}󰁼%{F-}"
ramp-capacity-2 = "%{F#E8B04B}󰁾%{F-}"
ramp-capacity-3 = "%{F#E8B04B}󰂀%{F-}"
ramp-capacity-4 = "%{F#E8B04B}󰂂%{F-}"
; cargando: anima el rayo entre niveles (nf-md-battery_charging_*)
animation-charging-0 = "%{F#E8B04B}󰢜%{F-}"
animation-charging-1 = "%{F#E8B04B}󰂆%{F-}"
animation-charging-2 = "%{F#E8B04B}󰂈%{F-}"
animation-charging-3 = "%{F#E8B04B}󰂉%{F-}"
animation-charging-4 = "%{F#E8B04B}󰂋%{F-}"
animation-charging-framerate = 750

[module/volume]
; modulo interno: se entera de los cambios por eventos de pipewire-pulse,
; no hace falta un script preguntando a pactl cada 2 s
type = internal/pulseaudio
use-ui-max = false
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
; nf-md-volume_mute U+F075F
format-muted = "%{F#D70A53}󰝟%{F-} mute"
; nf-md-volume_low / medium / high (U+F057F, F0580, F057E)
ramp-volume-0 = "%{F#E8B04B}󰕿%{F-}"
ramp-volume-1 = "%{F#E8B04B}󰖀%{F-}"
ramp-volume-2 = "%{F#E8B04B}󰕾%{F-}"
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/mic]
type = custom/script
exec = ~/.local/bin/estado-microfono.sh
interval = 3
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

[module/luz]
type = custom/script
exec = ~/.local/bin/luz-nocturna.sh
interval = 10
click-left = ~/.local/bin/luz-nocturna.sh toggle

[module/power]
type = custom/text
; nf-md-power U+F0425
label = "󰐥"
label-foreground = ${colors.carmesi}
label-padding = 1
click-left = ~/.local/bin/powermenu.sh
