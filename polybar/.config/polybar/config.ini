[bar/main]
width = 100%
height = 28
background = #ee0f0f12
foreground = #b3b3b8
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = JetBrainsMono Nerd Font Mono:size=11;2
modules-left = logo bspwm
modules-center = date
modules-right = network cpu memory

[module/logo]
type = custom/text
label = ""
label-foreground = #E8B04B
label-padding = 1

[module/bspwm]
type = internal/bspwm
label-focused = %name%
label-focused-background = #D70A53
label-focused-foreground = #0f0f12
label-focused-padding = 2
label-occupied = %name%
label-occupied-foreground = #D70A53
label-occupied-padding = 2
label-empty = %name%
label-empty-foreground = #45474e
label-empty-padding = 2
label-urgent = %name%
label-urgent-background = #E8B04B
label-urgent-foreground = #0f0f12
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 5
date = %H:%M
label = "%{F#E8B04B}%{F-} %date%"

[module/network]
type = internal/network
interface = wlp2s0
interval = 3
label-connected = "%{F#E8B04B}%{F-} %local_ip%"

[module/cpu]
type = internal/cpu
interval = 2
label = "%{F#D70A53}%{F-} %percentage%%"

[module/memory]
type = internal/memory
interval = 2
label = "%{F#E8B04B}%{F-} %percentage_used%%"
