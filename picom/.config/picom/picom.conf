# ============================================================
#  picom — Rice "Debian Crimson" (hardware real, AMD)
#  Syntax para picom v12 (Debian 13)
# ============================================================

#"-- Motor de renderizado: glx para GPU real (xrender solo en VMs)
backend = "glx";
vsync = true;

#"--- Esquinas redondeadas ---
corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'"
];

#"--- Sombras ---
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#"--- Opacidad ---
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

opacity-rule = [
  "90:class_g = 'kitty'",
  "95:class_g = 'Thunar'"
];

#"--- Blur (fondo difuminado en ventanas translucidas) ---
blur = {
  method = "dual_kawase";
  strength = 5;
};

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

#"--- Sin fades (snappy, estilo bspwm) ---
fading = false;
