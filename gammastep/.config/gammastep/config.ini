; gammastep — luz nocturna del Rice "Debian Crimson"
; De dia la pantalla queda como esta (6500K = neutro); de noche baja a
; 3800K (calido, menos azul -> menos fatiga). La transicion es gradual
; siguiendo la puesta de sol calculada con la latitud/longitud de abajo.
; Toggle manual: pkill -USR1 -x gammastep (menu F9 "Luz nocturna on/off")

[general]
temp-day=6500
temp-night=3800
fade=1
; ubicacion fija (sin geoclue: un servicio menos corriendo)
location-provider=manual
adjustment-method=randr

[manual]
; Lima, Peru (zona horaria del sistema: America/Lima). Cambiar si viajas.
lat=-12.05
lon=-77.04
