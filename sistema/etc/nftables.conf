#!/usr/sbin/nft -f
# nftables — Rice "Debian Crimson". Lo carga nftables.service al arrancar.
# Los perfiles viven en /etc/nftables.d/ y los cambia "firewall-perfil"
# (a mano desde F9, o solo al conectarse a una red segun sea de confianza).
# Al arrancar: PUBLICA (lo mas cerrado). En cuanto NetworkManager conecta,
# el dispatcher aplica el perfil que toque.
include "/etc/nftables.d/perfil-publica.nft"
