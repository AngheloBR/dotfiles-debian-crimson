#!/usr/sbin/nft -f
# nftables — firewall del Rice "Debian Crimson" (laptop)
#
# Idea: la laptop es un CLIENTE. Todo lo que SALE se permite; de lo que
# ENTRA solo pasa lo que responde a algo que pedimos nosotros, ping, y
# el descubrimiento de impresoras/escaner en la red local (mDNS).
# Todo lo demas (incluido SSH) se descarta sin responder.
#
# Instalar:  sudo cp ~/.dotfiles/sistema/etc/nftables.conf /etc/nftables.conf
#            sudo systemctl enable --now nftables
# Recargar:  sudo nft -f /etc/nftables.conf
# Ver:       sudo nft list ruleset
# Probar sin activar:  sudo nft -c -f /etc/nftables.conf

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # trafico local (localhost): siempre
        iif "lo" accept

        # respuestas a conexiones que iniciamos nosotros (web, apt, ssh saliente...)
        ct state established,related accept
        ct state invalid drop

        # ping (ipv4) y lo que ipv6 necesita para funcionar (vecinos, router)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # DHCPv6: la respuesta del router llega a este puerto
        udp dport 546 accept

        # mDNS (avahi/sane-airscan/cups): descubrir impresora y escaner por Wi-Fi
        udp dport 5353 accept

        # VMs de KVM (red 192.168.50.0/24 en virbr0): la laptop les da DHCP y DNS
        iifname "virbr0" accept

        # ── descomentar solo si hace falta ──
        # SSH hacia esta laptop desde la red de casa (nunca desde cualquier red):
        # ip saddr 192.168.0.0/16 tcp dport 22 accept
        # Tailscale (si se usa): udp dport 41641 accept
    }

    chain forward {
        # la laptop no enruta trafico de otros... salvo el de sus VMs (NAT):
        # lo que sale de virbr0 hacia internet y las respuestas de vuelta
        type filter hook forward priority 0; policy drop;
        iifname "virbr0" accept
        oifname "virbr0" ct state established,related accept
    }

    chain output {
        # todo lo que sale, permitido
        type filter hook output priority 0; policy accept;
    }
}
