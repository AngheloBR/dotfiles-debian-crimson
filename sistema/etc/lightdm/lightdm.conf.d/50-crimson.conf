# lightdm — Rice "Debian Crimson"
# Va en /etc/lightdm/lightdm.conf.d/ (lightdm lee esa carpeta ademas de
# lightdm.conf; asi no se edita el archivo del paquete).
#
# greeter-hide-users=false: muestra la lista de usuarios. Con un solo
# usuario, el greeter lo deja ya elegido y solo pide la contraseña
# (no hay que escribir "anghelo" en cada login).

[Seat:*]
greeter-hide-users=false
