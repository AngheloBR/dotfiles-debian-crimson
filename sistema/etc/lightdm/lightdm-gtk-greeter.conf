# lightdm-gtk-greeter — pantalla de login del Rice "Debian Crimson"
#
# El greeter corre como el usuario "lightdm", que NO puede leer /home:
#   - el fondo se copia a /usr/share/backgrounds/crimson/
#   - la fuente es la JetBrains Mono del sistema (fonts-jetbrains-mono),
#     no la Nerd Font de ~/.local/share/fonts
#   - el gtk.css del rice se copia a /var/lib/lightdm/.config/gtk-3.0/
#     para que el cuadro de login sea carmesi y no azul
# instalar-paquetes.sh hace las tres copias. Instalar a mano:
#   sudo cp ~/.dotfiles/sistema/etc/lightdm/lightdm-gtk-greeter.conf /etc/lightdm/
#   sudo cp ~/.dotfiles/sistema/etc/lightdm/lightdm.conf.d/50-crimson.conf /etc/lightdm/lightdm.conf.d/
# Probar sin cerrar sesion (necesita xserver-xephyr): dm-tool add-nested-seat

[greeter]
background = /usr/share/backgrounds/crimson/debian.png
user-background = false
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
font-name = JetBrains Mono 11
cursor-theme-name = Adwaita

# cuadro de login: sin foto de usuario, a la IZQUIERDA y a media altura
# ("start" ancla el borde izquierdo del cuadro al 8% del ancho), asi el
# logo Debian del fondo (abajo a la derecha) queda a la vista
hide-user-image = true
position = 8%,start 50%,center

# panel superior: nombre del equipo | reloj | sesion, accesibilidad, apagar
panel-position = top
indicators = ~host;~spacer;~clock;~spacer;~session;~a11y;~power
clock-format = %A %d de %B  ·  %H:%M

# texto nitido
xft-antialias = true
xft-hintstyle = slight
xft-rgba = rgb
